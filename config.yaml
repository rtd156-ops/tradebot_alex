# Configuración del bot de trading
# mode: "paper" (simulado, recomendado) | "live" (dinero real en Bybit)
mode: paper

# Cada cuántos minutos revisa el mercado
interval_minutes: 15

# Capital inicial simulado (USD) para el modo paper
paper_starting_cash: 10000

portfolio:
  # Máximo % del portafolio en una sola posición
  max_position_pct: 0.15
  # Stop-loss: vende si la posición cae este % desde el precio de compra
  stop_loss_pct: 0.05
  # Take-profit: vende si la posición sube este % desde el precio de compra
  take_profit_pct: 0.10
  # Máximo de operaciones de compra por día
  max_daily_trades: 6
  # Comisión simulada por operación (0.1% como Bybit spot)
  fee_pct: 0.001
  # --- Trailing stop (estilo Freqtrade) ---
  # Al superar el offset de ganancia, un stop dinámico sigue al precio pico
  trailing_stop: true
  trailing_stop_positive: 0.02          # distancia del stop bajo el pico
  trailing_stop_positive_offset: 0.03   # ganancia necesaria para activarlo
  # --- Protecciones (estilo Freqtrade, por estrategia en modo multi) ---
  # No recomprar el mismo símbolo durante N minutos tras cerrar una posición
  cooldown_minutes: 120
  # Pausar entradas si hay N stop-loss en la ventana de lookback
  stoploss_guard_limit: 3
  stoploss_guard_lookback_minutes: 1440   # 24 h
  stoploss_guard_stop_minutes: 720        # pausa de 12 h
  # Pausar entradas si el drawdown realizado excede este % del capital
  max_drawdown_pct: 0.15
  drawdown_lookback_minutes: 10080        # ventana de 7 días

assets:
  # Selección inicial según scripts/recommend.py (2026-06-10):
  # BTC (mejor score y noticias), XRP (2º score) y BNB (menor caída a 30d).
  crypto:
    - BTC/USDT
    - XRP/USDT
    - BNB/USDT
  stocks:
    - AAPL
    - MSFT
    - NVDA
    - SPY

strategy:
  # Timeframe de las velas para el análisis
  timeframe: 1h
  # Velas históricas a descargar por activo
  lookback_candles: 200
  # Medias móviles (cruce rápida/lenta)
  sma_fast: 20
  sma_slow: 50
  # RSI
  rsi_period: 14
  rsi_oversold: 30
  rsi_overbought: 70
  # Peso del sentimiento de noticias en la señal final (0 a 1)
  news_weight: 0.3
  # Umbral de score combinado para comprar/vender (entre -1 y 1)
  buy_threshold: 0.5
  sell_threshold: -0.5

# --- Modo multi-estrategia ---
# Varias estrategias corren en una sola instancia del bot, sobre la misma
# wallet, con capital separado lógicamente por un ledger SQLite y un
# allocator central. Cada estrategia hereda los bloques 'strategy' y
# 'portfolio' de arriba y puede sobrescribir cualquier parámetro.
# Si enabled=false, el bot opera en modo single-strategy clásico.
multi_strategy:
  enabled: true
  # Si los assets de una estrategia se omiten, usa assets.crypto.
  strategies:
    conservative:
      enabled: true
      capital_limit_usd: 2000
      portfolio:
        max_position_pct: 0.08
        stop_loss_pct: 0.03
        take_profit_pct: 0.06
        max_daily_trades: 2
        max_drawdown_pct: 0.10   # la conservadora se pausa antes
      strategy:
        buy_threshold: 0.65
        sell_threshold: -0.45
        news_weight: 0.2
    normal:
      enabled: true
      capital_limit_usd: 3000
      portfolio:
        max_position_pct: 0.15
        stop_loss_pct: 0.05
        take_profit_pct: 0.10
        max_daily_trades: 4
      strategy:
        buy_threshold: 0.5
        sell_threshold: -0.5
        news_weight: 0.3
    aggressive:
      enabled: true
      capital_limit_usd: 3000
      portfolio:
        max_position_pct: 0.25
        stop_loss_pct: 0.08
        take_profit_pct: 0.16
        max_daily_trades: 8
        stoploss_guard_limit: 4   # tolera un stop más antes de pausarse
        max_drawdown_pct: 0.20
      strategy:
        buy_threshold: 0.35
        sell_threshold: -0.6
        news_weight: 0.4
    # Reversión a la media: compra pánico (banda inferior de Bollinger +
    # RSI en sobreventa), vende el rebote a la media. Brilla en laterales.
    meanrev:
      enabled: true
      capital_limit_usd: 1000
      portfolio:
        max_position_pct: 0.20
        stop_loss_pct: 0.04
        take_profit_pct: 0.06   # toma ganancias cortas, acorde al estilo
        max_daily_trades: 4
        max_drawdown_pct: 0.12
      strategy:
        signal_model: mean_reversion
        bb_period: 20
        bb_mult: 2.0
        rsi_oversold: 35
        rsi_overbought: 65
        news_weight: 0.2
        buy_threshold: 0.5
        sell_threshold: -0.5
    # Breakout estilo Turtle: compra rupturas de máximos de 20 velas a favor
    # de tendencia, sale al perder mínimos de 10. Brilla en tendencias fuertes.
    breakout:
      enabled: true
      capital_limit_usd: 1000
      portfolio:
        max_position_pct: 0.20
        stop_loss_pct: 0.07
        take_profit_pct: 0.20   # deja correr; el trailing protege
        max_daily_trades: 4
        max_drawdown_pct: 0.15
      strategy:
        signal_model: breakout
        donchian_high: 20
        donchian_low: 10
        trend_sma: 50
        news_weight: 0.2
        buy_threshold: 0.5
        sell_threshold: -0.5

news:
  enabled: true
  # Fuentes RSS de noticias financieras y cripto
  feeds:
    - https://www.coindesk.com/arc/outboundfeeds/rss/
    - https://cointelegraph.com/rss
    - https://finance.yahoo.com/news/rssindex
    - https://feeds.content.dowjones.io/public/rss/mw_topstories
  # Máximo de titulares recientes a analizar por ciclo
  max_headlines: 60

notifications:
  # Notificar por Telegram cada operación (requiere TELEGRAM_BOT_TOKEN en .env)
  telegram: false
  # Notificar vía webhook HTTP, por ejemplo a un agente de OpenClaw
  # (requiere WEBHOOK_URL en .env; el bot manda POST JSON {"text": mensaje})
  webhook: false
  # Latido: cada cuántas horas mandar una señal de vida con el estado del
  # portafolio (0 = desactivado). También se manda al arrancar el bot.
  heartbeat_hours: 24
